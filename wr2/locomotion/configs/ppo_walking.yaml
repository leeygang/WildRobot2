# WR2 direct-PPO walking configuration, aligned with ToddlerBot's phase-guided
# policy and using a fixed-speed curriculum to acquire forward motion.
version: "0.15.0"
version_name: "WR2 fixed-speed forward gait acquisition"
seed: 0

environment:
  episode_length: 1000
  active_groups: [leg]
  # ToddlerBot's active pose regularizer, mapped into WR2's canonical 17-motor
  # order. Upper-body entries are zero because only legs are controlled.
  pose_weights: [0.0, 0.0, 0.0, 0.0, 0.01, 1.0, 0.01, 5.0, 5.0, 0.0, 0.0, 0.0, 0.01, 1.0, 0.01, 5.0, 5.0]
  # ToddlerBot policy semantics: an unbounded action is a radian residual
  # around walk_home. Physical targets, rather than policy samples, are clipped.
  policy_action_scale_rad: 0.25
  action_delay_steps: 1
  # ToddlerBot asymmetric-critic scales. These do not affect deployment input.
  privileged_linear_velocity_scale: 2.0
  privileged_actuator_force_scale: 0.1
  # Match ToddlerBot's nominal reset. Structured perturbations belong to the
  # domain-randomization path rather than unconditional reset noise.
  reset_joint_noise_rad: 0.0
  reset_velocity_noise_rad_s: 0.0
  # The v0.14 canary acquired a stable bilateral gait but moved backward: its
  # mixed 0.05--0.10 m/s commands often placed a cold policy outside the
  # strict ToddlerBot velocity kernel's useful gradient. Hold active commands
  # at 0.05 m/s until forward motion is acquired, then expand the curriculum.
  # Standing remains an explicit part of every episode through the zero-command
  # probability below.
  command_forward_range_m_s: [0.05, 0.05]
  command_lateral_range_m_s: [0.0, 0.0]
  command_yaw_range_rad_s: [0.0, 0.0]
  zero_command_probability: 0.20
  command_resample_steps: 150
  command_active_threshold_m_s: 0.05
  gait_cycle_s: 0.72
  # Start each episode at phase zero. The phase clock then advances continuously
  # through standing and command changes, matching ToddlerBot.
  randomize_gait_phase_on_reset: false
  swing_height_m: 0.04
  feet_phase_tracking_sigma_m2: 0.0007
  min_feet_lateral_distance_m: 0.06
  contact_force_threshold_n: 1.0
  target_torso_height_m: 0.301
  terminate_height_m: 0.20
  terminate_max_height_m: 1.0
  # Match ToddlerBot's active exp(-1000 * velocity_error^2) reward. The earlier
  # 0.15 m/s kernel let a stationary one-foot policy retain 64% of the velocity
  # reward at a 0.10 m/s command in the v0.10.1 canary.
  velocity_reward_sigma: 0.03162277660168379
  # Use the same strict tolerance for checkpoint scoring.
  velocity_tracking_sigma: 0.03162277660168379
  # Equivalent to ToddlerBot's exp(-4 * yaw_rate_error^2).
  yaw_tracking_sigma: 0.50
  height_tracking_sigma: 0.03
  # A policy-demand metric, not a fitted thermal time constant. C6 repeats show
  # that real temperature continues rising after 180 s, beyond a 20 s episode.
  torque_exposure_time_constant_s: 10.0
  # ToddlerBot strategy: direct PPO from scratch. The phase/command gait lookup
  # is privileged critic context, not an actor input, action baseline, or motor
  # imitation reward. WR2's five-DOF trajectory is solved against its canonical
  # MuJoCo foot sites and its lateral path satisfies the LIPM ZMP equation.
  zmp_reference:
    phase_samples: 36
    command_samples: 5
    # A slightly deeper reference crouch keeps 0.20--0.25 m/s stance geometry
    # reachable by WR2's five-DOF legs. The torso-height reward remains off.
    com_height_m: 0.294
    # Match ToddlerBot: single support lasts twice as long as double support.
    single_double_support_ratio: 2.0
    ik_damping: 0.0002
    ik_max_iterations: 120
    # The 0.25 m/s diagnostic bin reaches 6.19 mm; keep a narrow 7 mm gate.
    max_position_residual_m: 0.007
    max_orientation_residual_rad: 0.005

reward_weights:
  velocity_xy: 2.0
  yaw_rate: 1.5
  angular_velocity_xy: -1.0
  upright: 2.5
  torso_height: 0.0
  alive: 1.0
  pose: -0.5
  action_rate: -2.0
  joint_velocity: 0.0
  foot_slip: 0.0
  mechanical_power: -0.0002
  actuator_torque_squared: -0.005
  feet_phase: 7.5
  # Contact match is a P0 metric, not an extra dense reward in ToddlerBot's
  # current active phase-guided baseline.
  contact_phase: 0.0
  both_feet_contact: 0.0
  close_feet: -10.0
  feet_orientation: -5.0

observation_noise:
  # ToddlerBot's active encoder and temporally correlated IMU model. These
  # values remain provisional until the installed WR2 BNO085 is characterized.
  joint_position_uniform_rad: 0.05
  joint_velocity_uniform_rad_s: 0.10
  gyro_cutoff_hz: 0.35
  gyro_colored_std_rad_s: 0.25
  gyro_bias_walk_std_rad_s: 0.0002
  gyro_white_std_rad_s: 0.0
  gyro_amplitude_min: 0.8
  gyro_amplitude_max: 2.0
  # ToddlerBot perturbs its quaternion by this small-angle rotation process.
  # WR2 applies the equivalent rotation to its yaw-invariant gravity vector.
  projected_gravity_cutoff_hz: 0.25
  projected_gravity_colored_std_rad: 0.10
  projected_gravity_bias_walk_std_rad: 0.0001
  projected_gravity_white_std_rad: 0.0
  projected_gravity_amplitude_min: 0.8
  projected_gravity_amplitude_max: 1.2

domain_randomization:
  # Match ToddlerBot's active strategy: use moderate randomization while PPO
  # first acquires a gait. The wider WR2 deployment envelope is a later robust
  # training curriculum, not a uniform distribution for initial learning.
  enabled: true
  friction_scale: [0.7, 1.3]
  damping_scale: [0.8, 1.2]
  armature_scale: [0.8, 1.2]
  frictionloss_scale: [0.7, 1.3]
  # Keep actuator response recognizable during gait acquisition. Upper bounds
  # for torque, speed, and braking stay at the hardware-bounded nominal.
  kp_scale: [0.9, 1.1]
  kv_scale: [0.9, 1.1]
  torque_limit_scale: [0.9, 1.0]
  body_mass_scale: [0.8, 1.2]
  # Provisional +/-0.5-degree acquisition uncertainty. Expand only after a
  # bilateral forward gait has been learned and independently evaluated.
  target_bias_rad: [-0.008726646, 0.008726646]
  initial_torso_roll_rad: [-0.10, 0.10]
  initial_torso_pitch_rad: [-0.10, 0.10]
  # Provisional 0--0.5-degree acquisition range until bidirectional WR2 sweeps
  # identify a population distribution.
  backlash_rad: [0.0, 0.008726646]
  max_speed_scale: [0.9, 1.0]
  brake_torque_scale: [0.9, 1.0]
  passive_active_ratio_scale: [1.0, 1.0]

ppo:
  num_timesteps: 1000000000
  num_envs: 2048
  num_evals: 50
  num_eval_envs: 128
  # Score this acquisition experiment at the same speed used for learning.
  evaluation_forward_command_m_s: 0.05
  learning_rate: 0.00003
  entropy_cost: 0.0005
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  max_grad_norm: 1.0
  unroll_length: 20
  batch_size: 256
  num_minibatches: 8
  num_updates_per_batch: 4
  # Stochastic rollout summaries expose exploration behavior between the
  # deterministic checkpoint evaluations.
  training_metrics_steps: 2000000
  # Match ToddlerBot's active PPO configuration; all actor features already
  # have explicit physical scaling.
  normalize_observations: false

network:
  policy_hidden_layer_sizes: [512, 256, 128]
  value_hidden_layer_sizes: [512, 256, 128]
  activation: elu
  # Match ToddlerBot's residual policy. The target path clips only after
  # converting the unbounded sample to walk_home + 0.25 rad * action.
  distribution_type: normal
  noise_std_type: log
  init_noise_std: 0.5

checkpoints:
  save_every_evaluation: true
  keep_best: true
  selection_metric: acquisition

output:
  root: results/wr2_walking
  run_prefix: wr2_ppo
