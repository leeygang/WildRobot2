simulation:
    timestep_s: 0.002

control:
    period_s: 0.02
    decimation: 10

action:
    representation: joint_position_residual
    reference_keyframe: walk_home
    normalized_range: [-1.0, 1.0]
    scale_rad: 0.25
    # Keep zero until per-joint margins are supported: the upper-body neutral
    # pose still places shoulder-roll joints on CAD range endpoints.
    joint_limit_margin_rad: 0.0

# Actor-visible, hardware-reproducible proprioception. Contact and base linear
# velocity remain available to rewards/the privileged critic, but are excluded
# from the deployed actor until equivalent hardware measurements exist.
observation:
    layout_id: wr2_proprio_v1
    fields:
        - {name: command_velocity, size: 3, frame: torso, units: "m/s,m/s,rad/s"}
        - {name: joint_position_error, size: 17, units: rad}
        - {name: joint_velocity, size: 17, units: rad/s}
        - {name: previous_action, size: 17, units: normalized}
        - {name: torso_angular_velocity, size: 3, frame: torso, units: rad/s}
        - {name: projected_gravity, size: 3, frame: torso, units: normalized}
    scales:
        command_velocity: [1.0, 1.0, 1.0]
        joint_position_error: 1.0
        joint_velocity: 0.05
        previous_action: 1.0
        torso_angular_velocity: 1.0
        projected_gravity: 1.0
    history_frames: 1

imu_randomization:
    # Values must be fitted from stationary and motion logs from the actual
    # BNO085 installation before sim-to-real hardening and deployment.
    parameters_source: hardware_characterization_required
    mounting_error_std_deg: null
    gyro_white_noise_std_rad_s: null
    gyro_bias_initial_std_rad_s: null
    gyro_bias_walk_std_rad_s_per_step: null
    orientation_error_std_deg: null
    sample_delay_range_steps: null

actuators:
    htd45hServo:
        model_status: provisional_wr1_low_load_transfer
        source: WR1_2026-09-12_A1_B1_B2_sysid
        vendor_spec_source: HTD-45H_Bus_Servo_User_Manual_page_5
        rated_voltage_v: 11.1
        operating_voltage_range_v: [9.6, 12.6]
        vendor_stall_torque_nm: 4.4129925
        vendor_stall_current_a: 3.0
        vendor_no_load_speed_rad_s: 5.8177642
        vendor_position_accuracy_deg: 0.2
        command_range_units: [0, 1000]
        command_range_deg: [0.0, 240.0]
        command_resolution_rad: 0.0041887902
        training_target_speed_limit_rad_s: 5.8177642
        kp_sim: 31.902
        kv_sim: 0.5
        torque_limit_nm: 4.0
        damping: 1.10618
        frictionloss: 0.324094
        armature: 0.024992
        fitted_parameters: [kp_sim, damping, frictionloss]
        held_fixed_parameters: [kv_sim, armature, torque_limit_nm]
        mean_capture_replay_rmse_deg: 0.4386
        held_out_replay_rmse_deg: 0.480
        maximum_validated_load_nm: 0.56
        torque_limit_status: conservative_below_vendor_stall_upper_bound
        wr2_commissioning_status: low_load_tracking_observed_power_path_unqualified
        maximum_observed_wr2_fixture_load_nm: 0.5715
        fitted_extra_command_delay_steps: 0
        initial_training_randomization:
            kp_scale: [0.8, 1.2]
            kv_scale: [0.8, 1.2]
            damping_scale: [0.8, 1.2]
            armature_scale: [0.8, 1.2]
            frictionloss_scale: [0.7, 1.3]
            # Includes unmeasured voltage, wiring, BusLinker, temperature, and
            # unit-to-unit capacity variation. It never exceeds the 4 N m cap.
            torque_limit_scale: [0.6, 1.0]

contact:
    foot_collision_geoms: [left_foot_collision, right_foot_collision]
    foot_sites: [left_foot_center, right_foot_center]
