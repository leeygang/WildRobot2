simulation:
    timestep_s: 0.002

control:
    period_s: 0.02
    decimation: 10

action:
    representation: joint_position_residual
    normalized_range: [-1.0, 1.0]
    scale_rad: 0.25
    # Zero for the initial straight-leg home because both knee joints sit on a
    # CAD range endpoint. Revisit after defining a bent-knee locomotion home.
    joint_limit_margin_rad: 0.0

# Actor-visible, hardware-reproducible proprioception. Contact and base linear
# velocity remain available to rewards/the privileged critic, but are excluded
# from the deployed actor until equivalent hardware measurements exist.
observation:
    layout_id: wr2_proprio_v1
    fields:
        - {name: command_velocity, size: 3, frame: torso, units: "m/s,m/s,rad/s"}
        - {name: joint_position_error, size: 17, units: rad}
        - {name: joint_velocity, size: 17, units: rad/s}
        - {name: previous_action, size: 17, units: normalized}
        - {name: torso_angular_velocity, size: 3, frame: torso, units: rad/s}
        - {name: projected_gravity, size: 3, frame: torso, units: normalized}
    scales:
        command_velocity: [1.0, 1.0, 1.0]
        joint_position_error: 1.0
        joint_velocity: 0.05
        previous_action: 1.0
        torso_angular_velocity: 1.0
        projected_gravity: 1.0
    history_frames: 1

imu_randomization:
    # Values must be fitted from stationary and motion logs from the actual
    # BNO085 installation before policy training starts.
    parameters_source: hardware_characterization_required
    mounting_error_std_deg: null
    gyro_white_noise_std_rad_s: null
    gyro_bias_initial_std_rad_s: null
    gyro_bias_walk_std_rad_s_per_step: null
    orientation_error_std_deg: null
    sample_delay_range_steps: null

actuators:
    htd45hServo:
        kp_sim: 31.902
        kv_sim: 0.5
        torque_limit_nm: 4.0
        damping: 1.10618
        frictionloss: 0.324094
        armature: 0.024992

contact:
    foot_collision_geoms: [left_foot_collision, right_foot_collision]
    foot_sites: [left_foot_center, right_foot_center]
