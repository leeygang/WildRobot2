[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildrobot2"
version = "0.1.0"
description = "ToddlerBot-aligned software stack for WildRobot2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.3,<4",
]
training = [
    # Brax 0.14 still calls jax.device_put_replicated, removed by newer JAX.
    "brax>=0.14,<0.15",
    "gin-config",
    "jax>=0.6,<0.7; sys_platform == 'darwin'",
    "jax[cuda12]>=0.6,<0.7; sys_platform != 'darwin'",
    "mujoco>=3.3,<4",
    "mujoco-mjx>=3.3,<4",
    "wandb",
]
hardware = [
    "adafruit-circuitpython-bno08x",
    "pyserial",
]
sysid = [
    "mujoco>=3.3,<4",
    "pyserial>=3.5",
    "scipy>=1.11",
]
dev = [
    "mypy",
    "pytest",
    # 0.16.9 is killed while traversing this asset-heavy tree on macOS.
    "ruff==0.12.12",
]

[tool.setuptools.package-data]
wr2 = [
    "agents/*.json",
    "agents/*.md",
    "descriptions/**/*.json",
    "descriptions/**/*.yml",
    "descriptions/**/*.xml",
    "descriptions/**/*.stl",
    "locomotion/configs/*.yaml",
    "tools/servo_sysid/fixtures/*.xml",
    "tools/servo_sysid/plans/*.yaml",
    "tools/servo_sysid/*.json",
]

[tool.setuptools.packages.find]
include = ["wr2*"]
