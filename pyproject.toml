[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildrobot2"
version = "0.1.0"
description = "ToddlerBot-aligned software stack for WildRobot2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.3,<4",
]
training = [
    "brax",
    "gin-config",
    "jax",
    "mujoco-mjx",
    "wandb",
]
hardware = [
    "adafruit-circuitpython-bno08x",
    "pyserial",
]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.package-data]
wr2 = [
    "descriptions/**/*.json",
    "descriptions/**/*.yml",
    "descriptions/**/*.xml",
    "descriptions/**/*.stl",
]
